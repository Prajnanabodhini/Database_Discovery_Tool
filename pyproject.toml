[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mssql-database-documenter"
version = "0.3.0"
description = "Strictly read-only MSSQL discovery and documentation engine with a local Web UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyodbc>=5.1",
  "python-dotenv>=1.0",
  "Flask>=3.1",
  "Markdown>=3.7",
  "bleach>=6.2",
]

[project.optional-dependencies]
analysis = ["pandas>=2.2", "sqlparse>=0.5", "networkx>=3.2", "jinja2>=3.1"]
test = ["pytest>=8.0"]

[project.scripts]
mssql-documenter = "mssql_database_documenter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mssql_database_documenter = ["web/templates/*.html", "web/static/css/*.css", "web/static/js/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
