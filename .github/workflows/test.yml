name: Offline developer quality gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Windows / Python 3.11 / offline
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      MSSQL_DOC_SELF_TEST: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Assert clean offline starting state
        shell: pwsh
        run: |
          foreach ($runtimeRoot in @('output', 'git_export')) {
            if (Test-Path -LiteralPath $runtimeRoot) {
              throw "Runtime evidence root existed in the clean checkout: $runtimeRoot"
            }
          }

      - name: Install project and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Compile and import sanity
        shell: pwsh
        run: |
          python -m compileall -q main.py src
          python -c "import main; import mssql_database_documenter; import mssql_database_documenter.report_regeneration; import mssql_database_documenter.web.app"

      - name: Run offline regression suite
        shell: pwsh
        run: python -m pytest -q -p no:cacheprovider -m "not live" tests

      - name: Assert no runtime evidence was created
        if: always()
        shell: pwsh
        run: |
          $unexpected = @('output', 'git_export') | Where-Object {
            Test-Path -LiteralPath $_
          }
          if ($unexpected.Count -ne 0) {
            throw "Offline quality gate created runtime evidence: $($unexpected -join ', ')"
          }
